services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: devstore
      POSTGRES_PASSWORD: devstore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstore -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  api:
    profiles: ["backend"]
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Store: "Host=db;Port=5432;Database=ecommerce;Username=devstore;Password=devstore"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata: